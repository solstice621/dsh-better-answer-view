<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Web Answer · 开发版</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f5f7f5,#101712);--fg:light-dark(#24382c,#e5eee7);--muted:light-dark(#66776b,#a1b3a5);--line:light-dark(#dce5de,#35483a);--accent:light-dark(#2c6543,#a3d4ac)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.7 -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif}.demo-shell{max-width:1180px;margin:auto;padding:48px 30px}.demo-header{display:flex;align-items:flex-start;gap:20px;justify-content:space-between;margin-bottom:26px}.demo-eyebrow{font-size:11px;letter-spacing:.18em;color:var(--accent)}h1{font-size:clamp(25px,3.4vw,38px);font-weight:600;letter-spacing:-1px;margin:10px 0}h2{font-size:16px;font-weight:600}.demo-header p{color:var(--muted);margin:8px 0}.demo-label{font-size:12px;color:var(--muted);white-space:nowrap;padding-top:8px}.demo-layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:32px}.demo-layout aside{padding-top:20px}.demo-layout ol{padding-left:22px;color:var(--muted)}.demo-layout li{margin:15px 0}.demo-layout aside button{font:inherit;background:var(--accent);color:light-dark(white,#182c1e);border:0;border-radius:9px;padding:11px 15px;width:100%;cursor:pointer}.demo-note{font-size:12px;color:var(--muted)}.demo-message{border-top:1px solid var(--line);padding:14px 0}.demo-message p{color:var(--muted);font-size:13px}.demo-message pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.7 ui-monospace,monospace}.demo-layout>*{min-width:0}@media(max-width:760px){.demo-shell{padding:24px 14px}.demo-header{display:block}.demo-label{display:block}.demo-layout{display:block}.demo-layout aside{padding:0}.demo-layout ol{display:none}.demo-layout aside button{width:auto}}
</style></head><body><div id="root"></div><script type="module" src="/dist/demo.js"></script></body></html>
